name: Pulumi PR Guardrails

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  preview:
    name: Preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PULUMI_SKIP_UPDATE_CHECK: "true"
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
      PULUMI_BACKEND_URL: file:///workspace/.pulumi-backend
      PULUMI_PREVIEW_STACKS: dev
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Start development environment
        run: make start

      - name: Run preview guardrail
        run: make publish-pulumi-preview-summary

      - name: Upload preview artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pulumi-preview-unprivileged
          path: .artifacts/pulumi-preview

  destructive_diff:
    name: Destructive Diff Gate
    if: ${{ always() && needs.preview.result == 'success' }}
    runs-on: ubuntu-latest
    needs:
      - preview
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Start development environment
        run: make start

      - name: Download unprivileged preview artifact
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
        with:
          name: pulumi-preview-unprivileged
          path: .artifacts/pulumi-preview

      - name: Stage GitHub event payload for the guardrail helper
        run: |
          mkdir -p .artifacts
          cp "${GITHUB_EVENT_PATH}" .artifacts/github-event.json

      - name: Enforce destructive diff gate
        run: make test-destructive-diff
