x-pulumi-base: &pulumi-base
  build:
    context: .
    dockerfile: Dockerfile
    target: ${COMPOSE_TARGET:-dev}
    args:
      UID: "${UID:-1000}"
      GID: "${GID:-1000}"
      USERNAME: "dev"
  working_dir: /workspace
  volumes:
    - type: bind
      source: .
      target: /workspace
  environment:
    - AWS_REGION
    - AWS_DEFAULT_REGION
    - PULUMI_STACK
    - PULUMI_BACKEND_URL
    - AWS_ACCOUNT_ID
    - PULUMI_SECRETS_PROVIDER
    - PULUMI_PREVIEW_STACKS
    - PULUMI_DRIFT_STACKS
    - PULUMI_COMMIT_SHA
    - PULUMI_EXPECTED_SHA
    - PULUMI_DIR
    - PULUMI_SKIP_UPDATE_CHECK
    - INIT_ENVIRONMENT
    - INIT_ACCOUNT_ID
    - GITHUB_ACTIONS
    - GITHUB_REPOSITORY
    - GITHUB_REF
    - GITHUB_EVENT_NAME
    - GITHUB_SHA
    - PYTHONPATH=/workspace/pulumi
  tty: true
  stdin_open: true

services:
  pulumi:
    <<: *pulumi-base

  # Opt in to this service only for commands that intentionally need host AWS
  # config or host-exported AWS_* variables inside the container.
  pulumi-aws:
    <<: *pulumi-base
    env_file:
      - path: .env
        required: false
    build:
      context: .
      dockerfile: Dockerfile
      target: ${COMPOSE_TARGET:-dev}
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
        USERNAME: "dev"
    volumes:
      - type: bind
        source: .
        target: /workspace
      - type: bind
        source: "${HOME}/.aws"
        target: "/home/dev/.aws"
        read_only: true
    environment:
      - PULUMI_STACK
      - PULUMI_BACKEND_URL
      - AWS_ACCOUNT_ID
      - PULUMI_SECRETS_PROVIDER
      - PULUMI_PREVIEW_STACKS
      - PULUMI_DRIFT_STACKS
      - PULUMI_COMMIT_SHA
      - PULUMI_EXPECTED_SHA
      - PULUMI_DIR
      - PULUMI_SKIP_UPDATE_CHECK
      - INIT_ENVIRONMENT
      - INIT_ACCOUNT_ID
      - GITHUB_ACTIONS
      - GITHUB_REPOSITORY
      - GITHUB_REF
      - GITHUB_EVENT_NAME
      - GITHUB_SHA
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN
      - AWS_PROFILE
      - AWS_REGION
      - AWS_DEFAULT_REGION
      - PYTHONPATH=/workspace/pulumi
